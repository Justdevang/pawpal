# Flutter flavor configuration

flavors:
  dev:
    app:
      name: "PawPal Dev"
      applicationId: "com.pawpal.app.dev"
      iosBundleId: "com.pawpal.app.dev"
      versionName: "1.0.0-dev"
      versionCode: 1
      icon: "assets/images/app_icon_dev.png"
    firebase:
      android: "google-services-dev.json"
      ios: "GoogleService-Info-Dev.plist"
