  prod:
    app:
      name: "PawPal"
      applicationId: "com.pawpal.app"
      iosBundleId: "com.pawpal.app"
      versionName: "1.0.0"
      versionCode: 1
      icon: "assets/images/app_icon.png"
    firebase:
      android: "google-services.json"
      ios: "GoogleService-Info.plist"
    env: ".env"